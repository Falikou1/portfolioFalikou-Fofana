<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" rx="16" fill="#ffffff"/>

  <g transform="translate(15, 10)">
    <!-- 7 Stars Orbiting Around -->
    <!-- Star 1 (Top large star above I) -->
    <polygon points="195,60 205,92 239,94 211,114 221,147 194,127 166,146 177,113 151,93 184,91" fill="#28AEE5"/>
    
    <!-- Star 2 (Top left) -->
    <!-- cx: 108, cy: 155, r: 34, r_in: 14 -->
    <polygon points="108,121 116,142 139,139 123,156 133,178 112,168 96,183 98,160 76,148 99,143" fill="#28AEE5"/>
    
    <!-- Star 3 (Mid left) -->
    <!-- cx: 85, cy: 242, r: 35, r_in: 15 -->
    <polygon points="85,207 90,231 114,242 89,249 85,274 72,253 47,256 63,237 51,215 73,225" fill="#28AEE5"/>
    
    <!-- Star 4 (Bottom left) -->
    <!-- cx: 122, cy: 318, r: 28, r_in: 12 -->
    <polygon points="122,290 131,307 151,304 138,319 146,338 127,329 113,342 114,322 96,313 115,308" fill="#28AEE5"/>
    
    <!-- Star 5 (Bottom left-center) -->
    <!-- cx: 190, cy: 338, r: 21, r_in: 9 -->
    <polygon points="190,317 194,331 209,334 196,343 198,358 187,348 173,354 180,341 170,329 184,331" fill="#28AEE5"/>
    
    <!-- Star 6 (Bottom center) -->
    <!-- cx: 242, cy: 326, r: 16, r_in: 7 -->
    <polygon points="242,310 246,321 258,320 249,328 253,339 243,334 233,340 236,329 226,323 237,321" fill="#28AEE5"/>
    
    <!-- Star 7 (Bottom under U) -->
    <!-- cx: 278, cy: 304, r: 13, r_in: 5.5 -->
    <polygon points="278,291 281,300 290,301 283,306 285,315 278,310 270,314 273,306 267,300 276,301" fill="#28AEE5"/>

    <!-- Acronym IUA -->
    <!-- Letter I -->
    <path d="M 165,178 L 225,178 L 225,198 L 208,198 L 208,268 L 225,268 L 225,288 L 165,288 L 165,268 L 182,268 L 182,198 L 165,198 Z" fill="#28AEE5"/>

    <!-- Letter U with central stencil slit -->
    <!-- Left U branch -->
    <path d="M 238,178 L 285,178 L 285,198 L 268,198 L 268,245 C 268,265 278,276 291,276 C 295,276 298,275 301,273 L 301,293 C 297,294 292,295 286,295 C 258,295 238,278 238,245 L 238,198 L 228,198 L 228,178 Z" fill="#28AEE5"/>
    <!-- Right U branch -->
    <path d="M 307,288 L 307,198 L 291,198 L 291,178 L 338,178 L 338,198 L 327,198 L 327,245 C 327,265 320,280 307,288 Z" fill="#28AEE5"/>

    <!-- Letter A -->
    <path d="M 378,178 L 408,178 L 444,288 L 420,288 L 412,262 L 377,262 L 369,288 L 348,288 Z M 383,243 L 407,243 L 395,203 Z" fill="#28AEE5"/>

    <!-- Subtitle: Institut Universitaire d'Abidjan -->
    <text x="444" y="336" text-anchor="end" fill="#28AEE5" font-family="'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="31px">Institut</text>
    <text x="444" y="374" text-anchor="end" fill="#28AEE5" font-family="'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="31px">Universitaire</text>
    <text x="444" y="412" text-anchor="end" fill="#28AEE5" font-family="'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="31px">d'Abidjan</text>
  </g>
</svg>
