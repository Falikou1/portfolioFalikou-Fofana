<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration Privée — Falikou FOFANA Portfolio CMS</title>
  <link rel="icon" href="../assets/images/falikou_photo.png" type="image/png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="admin-layout">
    
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">FF</div>
        <div class="sidebar-title">
          <span>Falikou FOFANA</span>
          <span class="sidebar-subtitle">CMS Administration</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Général</div>
        <button class="nav-item active" data-tab="dashboard">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span>Tableau de bord</span>
        </button>
        <button class="nav-item" data-tab="profile">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span>Profil & Identité</span>
        </button>

        <div class="nav-section-title">Contenu Portfolio</div>
        <button class="nav-item" data-tab="projects">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>Projets & Réalisations</span>
        </button>
        <button class="nav-item" data-tab="skills">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Compétences & Outils</span>
        </button>
        <button class="nav-item" data-tab="experience">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
          <span>Expériences & Rôles</span>
        </button>
        <button class="nav-item" data-tab="education">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
          <span>Formations & Diplômes</span>
        </button>
        <button class="nav-item" data-tab="services">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
          <span>Services Proposés</span>
        </button>

        <div class="nav-section-title">Design & Médias</div>
        <button class="nav-item" data-tab="design">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
          <span>Apparence & Design</span>
        </button>
        <button class="nav-item" data-tab="sections">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
          <span>Sections & Textes</span>
        </button>
        <button class="nav-item" data-tab="media">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>Médiathèque</span>
        </button>

        <div class="nav-section-title">Gestion & Système</div>
        <button class="nav-item" data-tab="messages">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>Messages Reçus</span>
        </button>
        <button class="nav-item" data-tab="history">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>Historique & Audit</span>
        </button>
        <button class="nav-item" data-tab="settings">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>Paramètres & SEO</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <img src="../assets/images/falikou_photo_clean.png" class="user-avatar" alt="Falikou">
          <div class="user-info">
            <span class="user-name">Falikou FOFANA</span>
            <span class="user-role">Administrateur</span>
          </div>
        </div>
        <button class="btn btn-secondary btn-icon" id="logoutBtn" title="Se déconnecter">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </aside>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="admin-main">
      
      <!-- TOP HEADER -->
      <header class="admin-header">
        <div class="header-left">
          <button class="mobile-sidebar-toggle" id="mobileSidebarToggle">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="page-title" id="pageTitle">📊 Tableau de Bord</h1>
          <div id="syncStatusPill" class="sync-status-pill">
            <span class="status-dot"></span>
            <span>Portfolio synchronisé</span>
          </div>
        </div>

        <div class="header-actions">
          <button class="btn btn-secondary" id="saveDraftBtn">Enregistrer Brouillon</button>
          <button class="btn btn-primary" id="publishBtn">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            <span>Publier les modifications</span>
          </button>
          <button class="btn btn-secondary btn-icon" id="togglePreviewBtn" title="Afficher/Masquer l'Aperçu en Direct">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </header>

      <!-- SPLIT VIEW BODY (CONTENT LEFT + LIVE PREVIEW RIGHT) -->
      <div class="admin-body">
        
        <!-- DYNAMIC TAB CONTENT PANE -->
        <section class="admin-content-pane" id="adminTabContent">
          <!-- Content dynamically rendered by admin-app.js -->
        </section>

        <!-- LIVE PREVIEW IFRAME PANE -->
        <aside class="admin-preview-pane">
          <div class="preview-toolbar">
            <div style="font-size: 0.8rem; font-weight: 700; color: var(--admin-text-muted);">
              👁️ Aperçu Temps Réel
            </div>
            <div class="preview-devices">
              <button class="preview-btn active" data-device="desktop" title="Vue Bureau">💻</button>
              <button class="preview-btn" data-device="tablet" title="Vue Tablette">📱</button>
              <button class="preview-btn" data-device="mobile" title="Vue Mobile">📲</button>
            </div>
          </div>
          <div class="preview-iframe-wrapper">
            <iframe id="previewIframe" class="preview-iframe" src="../index.html?preview=1" title="Aperçu Portfolio"></iframe>
          </div>
        </aside>

      </div>
    </main>

  </div>

  <script src="js/admin-auth.js"></script>
  <script src="js/admin-app.js"></script>
</body>
</html>
