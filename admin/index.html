<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Administration Privée — Falikou FOFANA Portfolio CMS</title>
  
  <!-- Mobile & PWA App Mode -->
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Falikou CMS">
  <link rel="apple-touch-icon" href="../assets/images/falikou_photo.png">
  <link rel="icon" href="../assets/images/falikou_photo.png" type="image/png">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="./css/admin.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --admin-bg: #09090b;
      --admin-sidebar-bg: #111115;
      --admin-card-bg: #16161c;
      --admin-card-hover: #1c1c24;
      --admin-border: rgba(255, 255, 255, 0.08);
      --admin-border-focus: rgba(218, 56, 5, 0.5);
      --admin-accent: #da3805;
      --admin-accent-hover: #ff4d15;
      --admin-accent-glow: rgba(218, 56, 5, 0.25);
      --admin-text-main: #f8fafc;
      --admin-text-muted: #94a3b8;
      --admin-text-dim: #64748b;
      --admin-success: #10b981;
      --admin-success-bg: rgba(16, 185, 129, 0.12);
      --admin-warning: #f59e0b;
      --admin-warning-bg: rgba(245, 158, 11, 0.12);
      --admin-danger: #ef4444;
      --admin-danger-bg: rgba(239, 68, 68, 0.12);
      --admin-info: #3b82f6;
      --admin-info-bg: rgba(59, 130, 246, 0.12);
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --sidebar-width: 260px;
      --header-height: 70px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background-color: var(--admin-bg);
      color: var(--admin-text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--admin-accent); }

    .admin-layout { display: flex; width: 100vw; height: 100vh; overflow: hidden; }

    /* SIDEBAR */
    .admin-sidebar {
      width: var(--sidebar-width);
      background: var(--admin-sidebar-bg);
      border-right: 1px solid var(--admin-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: var(--transition);
      z-index: 100;
    }
    .sidebar-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--admin-border);
    }
    .sidebar-logo-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--admin-accent), #ff6b3d);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-family: var(--font-heading);
      box-shadow: 0 4px 12px var(--admin-accent-glow);
    }
    .sidebar-title {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
    }
    .sidebar-subtitle {
      font-size: 0.72rem;
      color: var(--admin-accent);
      font-weight: 600;
      text-transform: uppercase;
    }
    .sidebar-nav {
      padding: 16px 12px;
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--admin-text-dim);
      font-weight: 700;
      padding: 12px 14px 6px;
      letter-spacing: 0.8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--admin-text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--admin-text-main);
      transform: translateX(3px);
    }
    .nav-item.active {
      background: var(--admin-accent-glow);
      color: #ff6b3d;
      font-weight: 600;
      border-left: 3px solid var(--admin-accent);
    }
    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--admin-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--admin-border); }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-size: 0.85rem; font-weight: 600; }
    .user-role { font-size: 0.72rem; color: var(--admin-text-dim); }

    /* MAIN */
    .admin-main { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--admin-bg); }
    .admin-header {
      height: var(--header-height);
      background: var(--admin-sidebar-bg);
      border-bottom: 1px solid var(--admin-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .mobile-sidebar-toggle { display: none; background: none; border: none; color: var(--admin-text-main); cursor: pointer; }
    .page-title { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .sync-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--admin-success-bg);
      color: var(--admin-success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .sync-status-pill.draft { background: var(--admin-warning-bg); color: var(--admin-warning); border-color: rgba(245, 158, 11, 0.3); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
    .header-actions { display: flex; align-items: center; gap: 12px; }

    /* BODY */
    .admin-body { display: flex; flex-grow: 1; overflow: hidden; }
    .admin-content-pane { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 24px; }
    
    /* PREVIEW */
    .admin-preview-pane {
      width: 480px;
      border-left: 1px solid var(--admin-border);
      background: #000000;
      display: flex;
      flex-direction: column;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .admin-preview-pane.collapsed { width: 0; border-left: none; }
    .preview-toolbar {
      height: 48px;
      background: var(--admin-sidebar-bg);
      border-bottom: 1px solid var(--admin-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .preview-devices { display: flex; align-items: center; gap: 6px; }
    .preview-btn {
      background: transparent;
      border: 1px solid var(--admin-border);
      color: var(--admin-text-muted);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }
    .preview-btn.active, .preview-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--admin-text-main); border-color: var(--admin-accent); }
    .preview-iframe-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #050507; padding: 12px; }
    .preview-iframe { width: 100%; height: 100%; border: 1px solid var(--admin-border); border-radius: var(--radius-md); background: white; transition: width 0.3s ease; }
    .preview-iframe.mobile { width: 375px; height: 667px; }
    .preview-iframe.tablet { width: 768px; height: 100%; }

    /* COMPONENTS */
    .card { background: var(--admin-card-bg); border: 1px solid var(--admin-border); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--admin-border); padding-bottom: 16px; }
    .card-title { font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 0.85rem; color: var(--admin-text-muted); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .stat-card { background: var(--admin-card-bg); border: 1px solid var(--admin-border); border-radius: var(--radius-md); padding: 20px; display: flex; align-items: center; gap: 16px; transition: var(--transition); }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--admin-border-focus); }
    .stat-icon { width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--admin-accent-glow); color: var(--admin-accent); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .stat-info { display: flex; flex-direction: column; }
    .stat-value { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 800; }
    .stat-label { font-size: 0.8rem; color: var(--admin-text-muted); font-weight: 500; }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: var(--transition); border: 1px solid transparent; }
    .btn-primary { background: var(--admin-accent); color: white; box-shadow: 0 4px 12px var(--admin-accent-glow); }
    .btn-primary:hover { background: var(--admin-accent-hover); transform: translateY(-2px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.06); color: var(--admin-text-main); border-color: var(--admin-border); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-danger { background: var(--admin-danger-bg); color: var(--admin-danger); border-color: rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: var(--admin-danger); color: white; }
    .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-sm); }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full-width { grid-column: 1 / -1; }
    .form-label { font-size: 0.82rem; font-weight: 600; color: var(--admin-text-muted); }
    .form-control { background: rgba(0, 0, 0, 0.25); border: 1px solid var(--admin-border); border-radius: var(--radius-sm); padding: 10px 14px; color: var(--admin-text-main); font-size: 0.9rem; outline: none; transition: var(--transition); width: 100%; }
    .form-control:focus { border-color: var(--admin-accent); box-shadow: 0 0 0 3px var(--admin-accent-glow); }
    textarea.form-control { min-height: 100px; resize: vertical; }

    .items-list { display: flex; flex-direction: column; gap: 10px; }
    .list-item-card { background: rgba(0, 0, 0, 0.2); border: 1px solid var(--admin-border); border-radius: var(--radius-sm); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .item-thumb { width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover; background: #222; }
    .item-details { flex-grow: 1; display: flex; flex-direction: column; }
    .item-title { font-weight: 600; font-size: 0.95rem; }
    .item-subtitle { font-size: 0.78rem; color: var(--admin-text-muted); }
    .item-actions { display: flex; align-items: center; gap: 8px; }

    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
    .media-card { aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; position: relative; border: 1px solid var(--admin-border); background: #111; cursor: pointer; }
    .media-card img { width: 100%; height: 100%; object-fit: cover; }
    .media-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); }
    .media-card:hover .media-overlay { opacity: 1; }

    .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: rgba(255, 255, 255, 0.15); transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--admin-accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    .color-picker-group { display: flex; align-items: center; gap: 10px; }
    .color-swatch-input { width: 42px; height: 42px; border: none; border-radius: var(--radius-sm); cursor: pointer; background: transparent; }

    .admin-toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; border-radius: var(--radius-md); background: var(--admin-card-bg); border: 1px solid var(--admin-border); color: var(--admin-text-main); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); z-index: 1000; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; }
    .admin-toast.show { transform: translateY(0); opacity: 1; }

    .admin-modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 99999; }
    .admin-modal { background: var(--admin-card-bg); border: 1px solid var(--admin-border); border-radius: var(--radius-lg); width: 92%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }

    /* BACKDROP MOBILE */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sidebar-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 1080px) { .admin-preview-pane { display: none !important; } }
    @media (max-width: 768px) {
      .admin-sidebar {
        position: fixed;
        top: 0;
        left: -290px;
        bottom: 0;
        width: 280px;
        z-index: 1000;
        box-shadow: 10px 0 35px rgba(0, 0, 0, 0.8);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .admin-sidebar.open { left: 0; transform: translateX(0); }
      .admin-header { height: 60px; padding: 0 14px; }
      .mobile-sidebar-toggle {
        display: flex !important;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--admin-border);
        color: var(--admin-text-main);
        cursor: pointer;
        flex-shrink: 0;
      }
      .page-title {
        font-size: 1.05rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 160px;
      }
      .sync-status-pill { display: none; }
      .header-actions { gap: 8px; }
      #saveDraftBtn, #togglePreviewBtn { display: none !important; }
      #publishBtn { padding: 8px 14px; font-size: 0.82rem; }
      .admin-content-pane { padding: 14px; gap: 16px; }
      .card { padding: 16px; border-radius: var(--radius-md); gap: 14px; }
      .card-header { flex-direction: column; align-items: stretch; gap: 10px; }
      .card-header > .btn, .card-header > a.btn { width: 100%; text-align: center; justify-content: center; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 12px 14px; gap: 10px; }
      .stat-icon { width: 38px; height: 38px; font-size: 1.1rem; }
      .stat-value { font-size: 1.35rem; }
      .stat-label { font-size: 0.72rem; }
      .form-grid { grid-template-columns: 1fr; gap: 12px; }
      .form-control, input, select, textarea { font-size: 16px !important; }
      .list-item-card { padding: 12px; gap: 10px; }
      .admin-modal { width: 95%; max-height: 94vh; padding: 18px 16px; border-radius: var(--radius-md); }
    }
    @media (max-width: 480px) {
      .page-title { max-width: 120px; font-size: 0.95rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .list-item-card { flex-wrap: wrap; }
      .item-actions { width: 100%; justify-content: flex-end; margin-top: 4px; }
      .media-grid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px; }
    }
  </style>
</head>
<body>

  <!-- MOBILE SIDEBAR BACKDROP -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="admin-layout">
    
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">FF</div>
        <div class="sidebar-title">
          <span>Falikou FOFANA</span>
          <span class="sidebar-subtitle">CMS Administration</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Général</div>
        <button class="nav-item active" data-tab="dashboard">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span>Tableau de bord</span>
        </button>
        <button class="nav-item" data-tab="profile">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span>Profil & Identité</span>
        </button>

        <div class="nav-section-title">Contenu Portfolio</div>
        <button class="nav-item" data-tab="projects">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>Projets & Réalisations</span>
        </button>
        <button class="nav-item" data-tab="skills">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Compétences & Outils</span>
        </button>
        <button class="nav-item" data-tab="experience">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
          <span>Expériences & Rôles</span>
        </button>
        <button class="nav-item" data-tab="education">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
          <span>Formations & Diplômes</span>
        </button>
        <button class="nav-item" data-tab="services">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138z"/></svg>
